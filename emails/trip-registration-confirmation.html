<div
  style="
    background: #f6f7f5;
    padding: 24px;
    font-family: Arial, Helvetica, sans-serif;
  "
>
  <div
    style="
      max-width: 560px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
    "
  >
    <p
      style="
        margin: 0 0 8px;
        font-size: 12px;
        letter-spacing: 2px;
        color: #15803d;
        font-weight: 700;
      "
    >
      SAKINA
    </p>
    <h2 style="margin: 0 0 12px; color: #111827">
      Trip Registration Confirmed
    </h2>
    <p style="margin: 0 0 12px; color: #374151">
      You're confirmed for <strong>{{tripTitle}}</strong>.
    </p>
    <p style="margin: 0 0 20px; color: #374151">
      You can view trip details anytime:
    </p>
    <a
      href="{{tripUrl}}"
      style="
        display: inline-block;
        background: #15803d;
        color: #ffffff;
        text-decoration: none;
        padding: 10px 16px;
        border-radius: 8px;
        font-weight: 600;
      "
    >
      View Trip
    </a>
  </div>
</div>
